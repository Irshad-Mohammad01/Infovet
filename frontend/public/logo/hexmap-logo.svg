<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HexMap">
  <defs>
    <linearGradient id="hexmap-stroke" x1="24" y1="2" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2997ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hexmap-face-top" x1="12.7" y1="11" x2="35.3" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#2997ff"/>
    </linearGradient>
    <linearGradient id="hexmap-face-left" x1="12.7" y1="17.5" x2="24" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0071e3"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="hexmap-face-right" x1="35.3" y1="17.5" x2="24" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon ring -->
  <path d="M24 3.5 L41.8 13.75 L41.8 34.25 L24 44.5 L6.2 34.25 L6.2 13.75 Z"
        stroke="url(#hexmap-stroke)" stroke-width="2.75" stroke-linejoin="round"/>

  <!-- Isometric cube: top, left and right faces -->
  <path d="M24 24 L12.74 17.5 L24 11 L35.26 17.5 Z" fill="url(#hexmap-face-top)"/>
  <path d="M24 24 L12.74 17.5 L12.74 30.5 L24 37 Z" fill="url(#hexmap-face-left)"/>
  <path d="M24 24 L35.26 17.5 L35.26 30.5 L24 37 Z" fill="url(#hexmap-face-right)"/>
</svg>
